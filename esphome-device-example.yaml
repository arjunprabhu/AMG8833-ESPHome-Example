esphome:
  name: deviceNameHere
  friendly_name: Friendly Name Here
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino


# external components for AMG8833 --> returns min, max, average and thermistor temperature
external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "---key goes here---"

ota:
  - platform: esphome
    password: "---password goes here---"

wifi:
  fast_connect: True
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${devicename} HS"
    password: !secret fallback_password

captive_portal:
    
web_server:
  port: 80
  


i2c:
  sda: GPIO6  # update accordingly.
  scl: GPIO7  # update accordingly.
  scan: true
  frequency: 400kHz

amg8833:
  address: 0x69
  update_interval: ${refreshInterval}




sensor:
#----------------------------------
# AMG8833 - Related Sensor readings
#----------------------------------
  - platform: amg8833
    min_temperature:
      name: "Min Temperature"
    max_temperature:
      name: "Max Temperature"
    average_temperature:
      name: "Average Temperature"
    thermistor:
      name: "Thermistor Temperature"
    